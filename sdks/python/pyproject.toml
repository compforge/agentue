[project]
name = "agentue"
version = "0.1.0"
description = "Python components for the AgentUE agent devloop kit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/compforge/agentue"
Repository = "https://github.com/compforge/agentue"
Issues = "https://github.com/compforge/agentue/issues"

[project.optional-dependencies]
ui = [
    "pydantic>=2.0,<3.0",
]
runner = [
    "pydantic>=2.0,<3.0",
    "python-stdx[redis]>=0.1.0,<0.2.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.11",
    "pydantic>=2.0,<3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentue"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
python-stdx = { git = "https://github.com/compforge/python-stdx.git" }
